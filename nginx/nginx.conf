# Load balancer in front of api-1 and api-2.

upstream api_pool {
    # No sticky sessions needed: any instance can serve any user, because
    # room events are shared through Redis pub/sub.
    #
    # least_conn: WebSockets live for hours, so "fewest open connections"
    # balances real load better than round robin (which counts requests).
    # zone: nginx runs one worker per CPU, each with its OWN balancing state.
    # Without a shared zone every worker starts at api-1, and we measured all
    # traffic landing on api-1. The zone shares counters across workers.
    least_conn;
    zone api_pool 64k;
    server api-1:8000;
    server api-2:8000;
}

# For WebSockets, "Connection: upgrade" must be sent upstream only when the
# client asked for an upgrade; plain HTTP requests keep "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # WebSockets through the load balancer.
    location /ws {
        proxy_pass http://api_pool;
        proxy_http_version 1.1;                       # upgrades need HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;       # hop-by-hop: must be forwarded explicitly
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # nginx closes idle proxied connections after 60 s by default. Our
        # client pings every 15 s, but an hour leaves room for slow networks.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Demo helpers: pin a connection to one instance to show cross-server chat.
    location /direct/api-1/ {
        proxy_pass http://api-1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /direct/api-2/ {
        proxy_pass http://api-2:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # REST API, load balanced the same way.
    location / {
        proxy_pass http://api_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
